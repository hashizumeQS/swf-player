name: swf_player
description: >-
  Flutter widgets for playing SWF4 / Flash Lite 1.x content: stage renderer,
  player controller, and a feature-phone style virtual keypad.
version: 0.1.2
repository: https://github.com/hashizumeQS/swf-player
issue_tracker: https://github.com/hashizumeQS/swf-player/issues
topics:
  - swf
  - flash
  - flash-lite
  - player
  - retro-gaming

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  swf_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
