name: CI

on:
  push:
    branches: [main]
  pull_request:

# workspace解決にはexample（Flutter依存）も含まれるため、全ジョブで
# Flutter SDKを使う（dartコマンドはFlutter同梱のものを使用）。
# swf_coreのPure Dart性はswf_core/pubspec.yamlの依存で担保される。
jobs:
  swf_core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: packages/swf_core
      - run: dart analyze --fatal-infos
        working-directory: packages/swf_core
      - run: dart test
        working-directory: packages/swf_core

  swf_player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
        working-directory: packages/swf_player
      - run: flutter test
        working-directory: packages/swf_player
      - run: flutter test
        working-directory: packages/swf_player/example
